server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: ai-support-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

electrahub:
  ai-support:
    provider-enabled: ${AI_PROVIDER_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    support-email: ${SUPPORT_EMAIL:support@electrahub.com}
    stream-token-delay-ms: ${AI_STREAM_TOKEN_DELAY_MS:18}
    session-service-url: ${SESSION_SERVICE_URL:http://session-service:8083}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
    charger-service-url: ${CHARGER_SERVICE_URL:http://charger-management-service:8086}
    ocpp-service-url: ${OCPP_SERVICE_URL:http://ocpp-service:8082}
    diagnostics-timeout-ms: ${AI_DIAGNOSTICS_TIMEOUT_MS:1800}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${AI_MODEL:gpt-4.1-mini}
    temperature: ${AI_TEMPERATURE:0.2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:900}
    llm-timeout-ms: ${AI_LLM_TIMEOUT_MS:12000}
