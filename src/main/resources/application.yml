server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: ai-support-service

app:
  access-context:
    secret: ${APP_INTERNAL_ACCESS_CONTEXT_SECRET:electrahub-local-access-context-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

electrahub:
  ai-support:
    tenant-context:
      require-signed-authenticated: ${AI_TENANT_CONTEXT_REQUIRED:true}
    provider-enabled: ${AI_PROVIDER_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    provider-chain: ${AI_PROVIDER_CHAIN:}
    support-email: ${SUPPORT_EMAIL:support@electrahub.com}
    stream-token-delay-ms: ${AI_STREAM_TOKEN_DELAY_MS:18}
    session-service-url: ${SESSION_SERVICE_URL:http://session-service:8083}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
    charger-service-url: ${CHARGER_SERVICE_URL:http://charger-management-service:8086}
    ocpp-service-url: ${OCPP_SERVICE_URL:http://ocpp-service:8082}
    diagnostics-timeout-ms: ${AI_DIAGNOSTICS_TIMEOUT_MS:1800}
    diagnostics-total-timeout-ms: ${AI_DIAGNOSTICS_TOTAL_TIMEOUT_MS:2400}
    thread-ttl-ms: ${AI_THREAD_TTL_MS:900000}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    ollama-base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    model: ${AI_MODEL:gpt-4.1-mini}
    vllm-enabled: ${AI_VLLM_ENABLED:false}
    vllm-base-url: ${VLLM_BASE_URL:http://vllm:8000}
    vllm-model: ${VLLM_MODEL:sparky-qwen3-8b}
    vllm-timeout-ms: ${AI_VLLM_TIMEOUT_MS:7000}
    ollama-enabled: ${AI_OLLAMA_ENABLED:true}
    ollama-model: ${OLLAMA_MODEL:${AI_MODEL:electrahub-sparky:4b}}
    ollama-timeout-ms: ${AI_OLLAMA_TIMEOUT_MS:${AI_LLM_TIMEOUT_MS:12000}}
    ollama-max-concurrent-requests: ${AI_OLLAMA_MAX_CONCURRENT_REQUESTS:1}
    local-runtime:
      ollama-keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
      warmup-enabled: ${AI_LOCAL_WARMUP_ENABLED:false}
      warmup-timeout-ms: ${AI_LOCAL_WARMUP_TIMEOUT_MS:30000}
      ovms-enabled: ${AI_OVMS_ENABLED:false}
      ovms-base-url: ${OVMS_BASE_URL:http://ovms:8000}
      ovms-model: ${OVMS_MODEL:OpenVINO/Qwen3-8B-int4-ov}
      ovms-timeout-ms: ${AI_OVMS_TIMEOUT_MS:12000}
    gemini-enabled: ${AI_GEMINI_ENABLED:false}
    hosted-fallback-enabled: ${AI_HOSTED_FALLBACK_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    gemini-timeout-ms: ${AI_GEMINI_TIMEOUT_MS:7000}
    provider-failure-cooldown-ms: ${AI_PROVIDER_FAILURE_COOLDOWN_MS:30000}
    temperature: ${AI_TEMPERATURE:0.12}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:180}
    llm-timeout-ms: ${AI_LLM_TIMEOUT_MS:12000}
